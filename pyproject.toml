[project]
name = "proselens"
version = "0.1.0"
description = "Explainable analysis of writing patterns associated with machine-generated text."
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "spacy>=3.7",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
# Makes `from app...` resolve without an editable install or sys.path hacks
# in individual test files.
pythonpath = ["backend"]
testpaths = ["tests"]
